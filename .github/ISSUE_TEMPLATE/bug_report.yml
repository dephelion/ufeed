name: Bug report
description: A post is blurred (or shown) wrongly, or uFeed is not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        uFeed never logs post text, so console lines starting with `[ufeed:` are safe to paste. Leave anything private out of screenshots.
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [X, LinkedIn, Reddit, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and uFeed version
      placeholder: Chrome 128, uFeed 0.8.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Your topics and strictness
      description: Wrong calls depend on them.
      placeholder: |
        software engineering, programming
        Strictness 7
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Optional. Store builds print only real errors, so this is often empty. Open the page's developer console (F12) and copy any red lines starting with `[ufeed:`.
      render: text
