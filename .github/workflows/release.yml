name: Release

# Bumping the version in a PR is the decision to release: merging it publishes
# the zips. A merge that keeps the version releases nothing. Never touches the stores.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: is this version released yet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: build and publish the store zips
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The job can write releases; dependency install scripts must not find that token.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format, typecheck, test, build
        run: npm run check

      - name: Zip Chrome, Firefox and sources
        run: npm run zip && npm run zip:firefox

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" .output/*.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$TAG" --generate-notes
