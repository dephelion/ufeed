name: Codex review

on:
  # Runs the workflow and prompt from main, so a PR cannot rewrite its own review.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reads earlier review threads for the prompt and posts the review.
  pull-requests: write

jobs:
  review:
    name: review
    # pull_request_target hands secrets to forks; never review them. Drafts are still moving.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Pinned to a reviewed commit: this job holds OPENAI_API_KEY and pull-requests write.
      - uses: juliomatcom/gtp-reviewer@v0.1.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6-luna
          effort: medium
          instructions-file: .github/codex/review.md
