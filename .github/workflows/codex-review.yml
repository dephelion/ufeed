name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: review
    # Forks get no secrets, and drafts are still moving.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Build prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            cat .github/codex/review.md
            printf '\n## Pull request #%s\n\n' "$PR_NUMBER"
            printf 'Diff: `git diff %s...%s`\n\n' "$BASE_SHA" "$HEAD_SHA"
            printf 'Title: %s\n\nBody:\n\n%s\n' "$PR_TITLE" "$PR_BODY"
          } > "$RUNNER_TEMP/codex-prompt.md"

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-luna-6
          effort: medium
          permission-profile: ':workspace'
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-schema-file: .github/codex/review-schema.json

  comment:
    name: comment
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            const { findings, confidence, justification } = JSON.parse(process.env.REVIEW);
            const levels = { high: '🟢 High', medium: '🟡 Medium', low: '🔴 Low' };
            const icons = { critical: '🔴', major: '🟠', minor: '🟡' };
            const comment = (finding) => `${icons[finding.severity]} **${finding.title}**\n\n${finding.body}`;
            const summary = (inline) => {
              const lines = ['## Codex review', ''];
              if (findings.length === 0) lines.push('No findings.', '');
              else if (!inline) {
                lines.push(...findings.map((finding) => `- \`${finding.path}:${finding.line}\` ${comment(finding).replace(/\n\n/g, ' — ')}`), '');
              }
              lines.push('### Confidence', '', levels[confidence], '', justification);
              return lines.join('\n');
            };
            const review = {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              commit_id: context.payload.pull_request.head.sha,
              event: 'COMMENT',
            };
            try {
              await github.rest.pulls.createReview({
                ...review,
                body: summary(true),
                comments: findings.map((finding) => ({ path: finding.path, line: finding.line, side: 'RIGHT', body: comment(finding) })),
              });
            } catch (error) {
              // A line outside the diff rejects the whole review; keep the findings in the summary.
              core.warning(`Inline review failed: ${error.message}`);
              await github.rest.pulls.createReview({ ...review, body: summary(false) });
            }
