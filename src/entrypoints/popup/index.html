<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeedLens</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>FeedLens</h1>
        <label class="language">
          <span id="language-flag" aria-hidden="true"></span>
          <select
            id="language"
            data-i18n-aria-label="languageLabel"
            data-i18n-title="languageLabel"
          ></select>
        </label>
      </div>
      <span class="chip" id="engine-chip">
        <span class="dot" id="engine-chip-dot"></span>
        <span id="engine-chip-text" data-i18n="chipInitial"></span>
      </span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span id="enabled-label"></span>
      </label>
    </header>

    <label class="field" for="topics" data-i18n="topicsLabel"></label>
    <textarea
      id="topics"
      rows="3"
      spellcheck="false"
      data-i18n-placeholder="topicsPlaceholder"
    ></textarea>
    <p class="hint" id="topics-hint" data-i18n="topicsHint"></p>
    <details>
      <summary data-i18n="tipsSummary"></summary>
      <ul class="hint">
        <li><b data-i18n="tipWordsTitle"></b> <span data-i18n="tipWordsBody"></span></li>
        <li>
          <b data-i18n="tipKeywordsTitle"></b> <span data-i18n="tipKeywordsBody"></span>
        </li>
        <li>
          <b data-i18n="tipCommasTitle"></b> <span data-i18n="tipCommasBody"></span>
        </li>
        <li><b data-i18n="tipLinesTitle"></b> <span data-i18n="tipLinesBody"></span></li>
        <li><b data-i18n="tipVocabTitle"></b> <span data-i18n="tipVocabBody"></span></li>
        <li>
          <b data-i18n="tipQualityTitle"></b> <span data-i18n="tipQualityBody"></span>
        </li>
      </ul>
    </details>

    <div class="actions">
      <button id="apply" type="button" disabled>
        <img src="/icon/32.png" alt="" class="btn-icon" />
        <span data-i18n="saveTopics"></span>
      </button>
      <span class="applied" id="applied" data-i18n="saved" hidden></span>
    </div>

    <label class="field" for="strictness">
      <span data-i18n="strictnessLabel"></span> <output id="strictness-value"></output>
    </label>
    <input type="range" id="strictness" min="0" max="10" step="1" />
    <p class="hint" id="strictness-hint"></p>

    <label class="field" for="model" data-i18n="modelLabel"></label>
    <select id="model">
      <option value="e5-small" data-i18n="modelOptionEnglish"></option>
      <option value="gemma" data-i18n="modelOptionMultilingual"></option>
    </select>
    <p class="hint" id="model-hint"></p>
    <details class="hint-details">
      <summary data-i18n="details"></summary>
      <p class="hint">
        <b data-i18n="modelDetailsEnglishTitle"></b>
        <span data-i18n="modelDetailsEnglishBody"></span>
        <br />
        <b data-i18n="modelDetailsMultilingualTitle"></b>
        <span data-i18n="modelDetailsMultilingualBody"></span>
        <br />
        <span data-i18n="modelDetailsKept"></span>
      </p>
    </details>

    <label class="check" for="blur-thin-media">
      <input type="checkbox" id="blur-thin-media" />
      <span data-i18n="blurMediaLabel"></span>
    </label>
    <details class="hint-details">
      <summary data-i18n="details"></summary>
      <p class="hint" data-i18n="blurMediaDetails"></p>
    </details>

    <label class="check" for="blur-other-languages">
      <input type="checkbox" id="blur-other-languages" />
      <span data-i18n="blurLanguageLabel"></span>
    </label>
    <details class="hint-details">
      <summary data-i18n="details"></summary>
      <p class="hint" id="language-hint">
        <span data-i18n="blurLanguageDetails"></span>
        <br />
        <span data-i18n="blurLanguageRefresh"></span>
      </p>
      <p class="hint" id="language-off" data-i18n="blurLanguageOff" hidden></p>
    </details>

    <label class="check" for="collapse-blurred">
      <input type="checkbox" id="collapse-blurred" />
      <span data-i18n="collapseLabel"></span>
    </label>
    <details class="hint-details">
      <summary data-i18n="details"></summary>
      <p class="hint" data-i18n="collapseDetails"></p>
    </details>

    <label class="check" for="show-scores">
      <input type="checkbox" id="show-scores" />
      <span data-i18n="scoresLabel"></span>
    </label>
    <details class="hint-details">
      <summary data-i18n="details"></summary>
      <p class="hint" data-i18n="scoresDetails"></p>
    </details>

    <section class="block">
      <label class="check block-head" for="tune-feedback">
        <input type="checkbox" id="tune-feedback" />
        <span data-i18n="thumbsLabel"></span>
      </label>
      <details class="hint-details">
        <summary data-i18n="details"></summary>
        <p class="hint block-hint" data-i18n="thumbsIntro"></p>
        <ul class="hint block-hint">
          <li data-i18n="thumbsUpMeans"></li>
          <li data-i18n="thumbsDownMeans"></li>
          <li data-i18n="thumbsCorrect"></li>
        </ul>
        <p class="hint block-hint" data-i18n="thumbsScope"></p>
        <p class="hint block-hint" data-i18n="thumbsPrivacy"></p>
      </details>
      <dl class="stats">
        <div>
          <dt data-i18n="statKept"></dt>
          <dd id="stat-up">0</dd>
        </div>
        <div>
          <dt data-i18n="statBlurred"></dt>
          <dd id="stat-down">0</dd>
        </div>
        <div>
          <dt data-i18n="statRated"></dt>
          <dd id="stat-total">0</dd>
        </div>
      </dl>
      <div class="row block-foot">
        <span class="hint block-note" id="tuning-note"></span>
        <button
          id="clear-tuning"
          class="ghost"
          type="button"
          data-i18n="clearTuning"
        ></button>
      </div>
    </section>

    <section class="block">
      <div class="row block-head">
        <span data-i18n="backupTitle"></span>
        <button id="export" class="ghost" type="button" data-i18n="backupExport"></button>
        <button id="import" class="ghost" type="button" data-i18n="backupImport"></button>
      </div>
      <p class="hint block-hint" data-i18n="backupHint"></p>
      <p class="transfer" id="transfer" hidden>
        <span class="transfer-name" id="transfer-name"></span>
        <span class="transfer-tail" id="transfer-tail"></span>
      </p>
      <input
        type="file"
        id="import-file"
        accept="application/json,.json"
        hidden
        aria-hidden="true"
      />
    </section>

    <section class="block">
      <div class="row block-head">
        <span data-i18n="resetTitle"></span>
        <button id="reset" class="ghost" type="button" data-i18n="resetButton"></button>
      </div>
      <p class="hint block-hint" data-i18n="resetHint"></p>
    </section>

    <footer>
      <p class="status-line">
        <span class="dot" id="dot"></span>
        <span id="status" data-i18n="statusInitial"></span>
      </p>
      <p class="status-line" id="engine-line">
        <span class="dot" id="engine-dot"></span>
        <span id="engine-status" data-i18n="engineInitial"></span>
      </p>
      <div class="contact">
        <p>
          <a
            href="https://github.com/dephelion/feedlens/issues/new/choose"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="reportIssue"
          ></a>
        </p>
        <a
          class="github"
          href="https://github.com/dephelion/feedlens"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="githubLabel"
          data-i18n-title="githubLabel"
        >
          <svg
            viewBox="0 0 16 16"
            width="20"
            height="20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
    </footer>
  </body>
  <script type="module" src="./popup.ts"></script>
</html>
