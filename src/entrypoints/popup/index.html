<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lensing</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Lensing</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span>On</span>
      </label>
    </header>

    <label class="field" for="topics">Topics</label>
    <textarea id="topics" rows="2" placeholder="tech, software, ai"></textarea>
    <div class="actions">
      <button id="apply" type="button" disabled>Apply</button>
      <span class="applied" id="applied" hidden>Saved</span>
    </div>
    <p class="hint" id="topics-hint">
      Name the subject in a few words. Short lists beat descriptions. Topics match
      subject, not quality: a shallow take and a deep post on the same subject both match.
    </p>

    <label class="field" for="strictness">
      Strictness <output id="strictness-value"></output>
    </label>
    <input type="range" id="strictness" min="0" max="1" step="0.01" />
    <p class="hint" id="strictness-hint"></p>


    <footer>
      <span class="dot" id="dot"></span>
      <span id="status">Checking engine…</span>
    </footer>
  </body>
  <script type="module" src="./popup.ts"></script>
</html>
